<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='css/reset.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <title>Simulados UNIVESP</title>
</head>
<body>
    <header>
        <div class="header-brand">
            <a href="/" class="a-home">
                <img src="{{url_for('static',filename='imagens/icone.png')}}" alt="LOGOTIPO UNIVESP">
                <hr><h2>Simulados</h2>
            </a>
        </div>
        {% if current_user.is_authenticated %}
        <div class="header-user">
            <span class="user-name">{{ current_user.name }}</span>
            <a class="btn btn-outline" href="{{url_for('auth.logout')}}">Sair</a>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <nav class="header-nav" id="header-nav">
            <a href="{{url_for('home.questionario')}}">Simulado</a>
            <a href="{{url_for('home.historico')}}">Histórico</a>
            <a href="{{url_for('home.desempenho')}}">Desempenho</a>
        </nav>
        {% else %}
        <div>
            <a class="btn btn-red" href="{{url_for('auth.login')}}">ENTRAR</a>
        </div>
        {% endif %}
    </header>
    <script>
        (function () {
            var btn = document.getElementById('hamburger');
            var nav = document.getElementById('header-nav');
            if (!btn) return;
            btn.addEventListener('click', function () {
                var open = nav.classList.toggle('open');
                btn.classList.toggle('open', open);
                btn.setAttribute('aria-expanded', open);
            });
        })();
    </script>
    {% block content %} {% endblock %}
</body>
</html>
